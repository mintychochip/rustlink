<!doctype html>
<html><head><meta charset="utf-8"><title>rustlink plots</title>
<style>body{font-family:monospace;max-width:940px;margin:0 auto;padding:20px}svg{width:100%;height:auto;border:1px solid #ccc;margin-bottom:20px}</style>
</head><body>
<h1>rustlink baseline vs narrow (results.jsonl)</h1>
<p>u32 is 0.69× std at 2^20; abs32 is 0.58× rc at 2^22.</p>
<h2>btree-lookup ratio (rustlink u32 / std)</h2>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="100%">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30" y="30" font-size="15" font-weight="600" fill="#111">btree-lookup ratio u32/std</text>
<text x="30" y="50" font-size="12" fill="#555">bench/containers/results.jsonl</text>
<line x1="80" y1="422" x2="640" y2="422" stroke="#e0e0e0" stroke-width="1"/>
<text x="72" y="426" font-size="12" text-anchor="end" fill="#111">0.4</text>
<line x1="80" y1="365" x2="640" y2="365" stroke="#e0e0e0" stroke-width="1"/>
<text x="72" y="369" font-size="12" text-anchor="end" fill="#111">0.6</text>
<line x1="80" y1="308" x2="640" y2="308" stroke="#e0e0e0" stroke-width="1"/>
<text x="72" y="312" font-size="12" text-anchor="end" fill="#111">0.8</text>
<line x1="80" y1="252" x2="640" y2="252" stroke="#000" stroke-width="2"/>
<text x="72" y="256" font-size="12" text-anchor="end" fill="#111">1</text>
<line x1="80" y1="195" x2="640" y2="195" stroke="#e0e0e0" stroke-width="1"/>
<text x="72" y="199" font-size="12" text-anchor="end" fill="#111">1.2</text>
<text x="80" y="470" font-size="12" text-anchor="middle" fill="#111">2^10</text>
<text x="192" y="470" font-size="12" text-anchor="middle" fill="#111">2^12</text>
<text x="304" y="470" font-size="12" text-anchor="middle" fill="#111">2^14</text>
<text x="416" y="470" font-size="12" text-anchor="middle" fill="#111">2^16</text>
<text x="528" y="470" font-size="12" text-anchor="middle" fill="#111">2^18</text>
<text x="640" y="470" font-size="12" text-anchor="middle" fill="#111">2^20</text>
<line x1="80" y1="70" x2="80" y2="450" stroke="#111" stroke-width="2"/>
<line x1="80" y1="450" x2="640" y2="450" stroke="#111" stroke-width="2"/>
<text x="360" y="495" font-size="13" text-anchor="middle" fill="#111">n = number of elements (log2)</text>
<text x="22" y="280" font-size="13" fill="#111" transform="rotate(-90 22 280)" text-anchor="middle">ratio (narrow / baseline)</text>
<polyline points="80,316 192,362 304,359 416,356 528,352 640,340" fill="none" stroke="#2563eb" stroke-width="2"/>
<circle cx="80" cy="316" r="3" fill="#2563eb"/>
<circle cx="192" cy="362" r="3" fill="#2563eb"/>
<circle cx="304" cy="359" r="3" fill="#2563eb"/>
<circle cx="416" cy="356" r="3" fill="#2563eb"/>
<circle cx="528" cy="352" r="3" fill="#2563eb"/>
<circle cx="640" cy="340" r="3" fill="#2563eb"/>
<line x1="650" y1="80" x2="674" y2="80" stroke="#2563eb" stroke-width="2"/>
<text x="682" y="84" font-size="12" fill="#2563eb">u32/std</text>
<text x="648" y="344" font-size="12" fill="#2563eb">0.69 @ 2^20</text>
</svg>
