[workspace]
resolver = "3"
members = ["crates/rustlink"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
zerocopy = { version = "0.8", features = ["derive"] }
proptest = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
